---
layout: default
---

<div class="inner-page inner-page--post">
  <div class="page-header">
    <a class="back-link" href="{{ '/writing.html' | relative_url }}">&larr; Writing</a>
    {% if page.date %}
      <p class="post-meta-date">{{ page.date | date: "%-d %B %Y" }}</p>
    {% endif %}
    <h1 class="post-heading">{{ page.title }}</h1>
    {% if page.description %}
      <p class="post-lede">{{ page.description }}</p>
    {% endif %}
  </div>

  <div class="post-content">
    {{ content }}
  </div>
</div>
{% if page.math %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.querySelector('.post-content'),{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false})"></script>
{% endif %}
